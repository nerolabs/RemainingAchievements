# Packages the addon and uploads it to CurseForge + GitHub Releases
# (and, once configured, WoWInterface + Wago) whenever a version tag
# (e.g. v0.1.0) is pushed.
#
# Required setup, once:
#   1. Create the project on curseforge.com and put its numeric ID in the TOC:
#        ## X-Curse-Project-ID: <id>
#      Generate an API token at https://authors.curseforge.com/account/api-tokens
#      and add it as this repo's actions secret named CF_API_KEY.
#
# Optional extra publish targets (each is skipped automatically until BOTH its
# TOC id and its actions secret exist — so the env lines below are inert now):
#   WoWInterface — TOC: `## X-WoWI-ID: <id>`  +  secret: WOWI_API_TOKEN
#     (token: https://www.wowinterface.com/downloads/filecpl.php?action=apitokens)
#   Wago Addons  — TOC: `## X-Wago-ID: <id>`  +  secret: WAGO_API_TOKEN
#     (token: https://addons.wago.io/account/apikeys)
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
